name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup-node js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install dependencies
        run: npm ci 

      - name: run lint
        run: npm run lint

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: build app
        run: npm run build

      - name: Debug files before deployment
        run: |
          echo "Checking if .next directory exists:"
          ls -la .next/ || echo ".next directory not found"
          echo "Checking if package.json exists:"
          ls -la package.json || echo "package.json not found"
          echo "Checking if public directory exists:"
          ls -la public/ || echo "public directory not found"
          echo "Checking if next.config.mjs exists:"
          ls -la next.config.mjs || echo "next.config.mjs not found"

      - name: set-up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check EC2 instance and security groups
        run: |
          echo "Checking EC2 instance status and security groups..."
          
          # Get instance ID from IP address
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.AWS_EC2_HOST }}" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not find instance with IP ${{ secrets.AWS_EC2_HOST }}"
            echo "Listing all running instances:"
            aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" \
              --query 'Reservations[*].Instances[*].[InstanceId,State.Name,PublicIpAddress,PrivateIpAddress]' \
              --output table
            exit 1
          fi
          
          echo "Found instance: $INSTANCE_ID"
          
          # Check instance status
          aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[*].Instances[*].[InstanceId,State.Name,PublicIpAddress,PrivateIpAddress]' \
            --output table
          
          # Check security groups
          echo "Checking security groups for SSM connectivity..."
          aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[*].Instances[*].SecurityGroups[*].[GroupId,GroupName]' \
            --output table
          
          # Get security group IDs
          SG_IDS=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[*].Instances[*].SecurityGroups[*].GroupId' \
            --output text)
          
          echo "Security group IDs: $SG_IDS"
          
          # Check outbound rules for HTTPS (required for SSM)
          for sg_id in $SG_IDS; do
            echo "Checking outbound rules for security group: $sg_id"
            aws ec2 describe-security-groups \
              --group-ids $sg_id \
              --query 'SecurityGroups[*].IpPermissionsEgress[*].[IpProtocol,FromPort,ToPort,IpRanges[*].CidrIp]' \
              --output table
          done

      - name: Setup SSH key and configuration
        run: |
          # Create SSH key file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2-ssh-key.pem
          chmod 600 /tmp/ec2-ssh-key.pem
          
          # Create SSH config for better connection management
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ secrets.AWS_EC2_HOST }}
            User ${{ secrets.AWS_EC2_USER }}
            IdentityFile /tmp/ec2-ssh-key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 60
            ServerAliveCountMax 3
            TCPKeepAlive yes
          EOF
          
          # Test SSH connection with detailed error reporting
          echo "Testing SSH connection..."
          if ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 -o LogLevel=DEBUG2 ec2-deploy "echo 'SSH connection successful'" 2>&1; then
            echo "✓ SSH connection successful"
          else
            echo "✗ SSH connection failed. Troubleshooting..."
            echo "Checking if instance is running..."
            aws ec2 describe-instances --instance-ids $(aws ec2 describe-instances --filters "Name=ip-address,Values=${{ secrets.AWS_EC2_HOST }}" --query 'Reservations[*].Instances[*].InstanceId' --output text) --query 'Reservations[*].Instances[*].[State.Name,PublicIpAddress,PrivateIpAddress]' --output table
            echo "SSH connection troubleshooting complete. Check AWS Console for instance status."
            exit 1
          fi

      - name: Fix SSM Agent connectivity
        run: |
          echo "Diagnosing and fixing SSM Agent issues..."
          
          # Check SSM Agent status and restart if needed
          ssh ec2-deploy "
            echo '=== SSM Agent Status Check ==='
            
            # Check if SSM agent is installed and running
            if systemctl is-active --quiet amazon-ssm-agent; then
              echo 'SSM Agent is running'
              systemctl status amazon-ssm-agent --no-pager -l
            else
              echo 'SSM Agent is not running, attempting to start...'
              sudo systemctl start amazon-ssm-agent
              sleep 5
              systemctl status amazon-ssm-agent --no-pager -l
            fi
            
            # Check network connectivity to SSM endpoints
            echo '=== Network Connectivity Check ==='
            echo 'Testing connectivity to SSM endpoints...'
            
            # Get region from metadata service
            REGION=\$(curl -s http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null || echo 'us-east-1')
            echo \"Detected region: \$REGION\"
            
            # Test connectivity to SSM endpoints
            for endpoint in \"ssm.\$REGION.amazonaws.com\" \"ssmmessages.\$REGION.amazonaws.com\" \"ec2messages.\$REGION.amazonaws.com\"; do
              echo \"Testing connectivity to \$endpoint...\"
              if timeout 10 nc -z \$endpoint 443; then
                echo \"✓ \$endpoint is reachable\"
              else
                echo \"✗ \$endpoint is not reachable\"
              fi
            done
            
            # Restart SSM agent if it was down
            echo '=== Restarting SSM Agent ==='
            sudo systemctl restart amazon-ssm-agent
            sleep 10
            
            # Check status after restart
            echo '=== Final SSM Agent Status ==='
            systemctl status amazon-ssm-agent --no-pager -l
            
            # Check if agent is registered
            echo '=== Checking SSM Agent Registration ==='
            sudo /snap/amazon-ssm-agent/current/amazon-ssm-agent status 2>/dev/null || echo 'SSM Agent status check failed'
            
            echo '=== SSM Agent Fix Complete ==='
          "

      - name: Deploy to EC2
        run: |
          set -e  # Exit on any error
          
          echo "Starting deployment to EC2..."
          
          # Create remote directory if it doesn't exist and clean up
          echo "Preparing remote directory..."
          ssh ec2-deploy "
            mkdir -p /home/${{ secrets.AWS_EC2_USER }}/uploader
            echo 'Cleaning up existing node_modules and package-lock.json...'
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            rm -rf node_modules package-lock.json
            echo 'Cleanup complete'
          "
          
          # Sync files to EC2 with better error handling
          echo "Syncing files to EC2..."
          rsync -az --delete --progress \
            -e "ssh -o ConnectTimeout=30 -o ConnectionAttempts=3" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.next/cache' \
            --exclude='package-lock.json' \
            ./ \
            ec2-deploy:/home/${{ secrets.AWS_EC2_USER }}/uploader/

          # Install dependencies and restart application
          echo "Installing dependencies and restarting application..."
          ssh -tt ec2-deploy "
            set -e
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            echo 'Current directory:' \$(pwd)
            
            # Check if package-lock.json exists and is valid
            if [ -f package-lock.json ]; then
              echo 'package-lock.json found, checking validity...'
              if ! npm ci --dry-run --omit=dev --no-audit --no-fund 2>/dev/null; then
                echo 'package-lock.json is corrupted, removing it...'
                rm -f package-lock.json
              fi
            fi
            
            # Clear npm cache to avoid corruption issues
            echo 'Clearing npm cache...'
            npm cache clean --force
            
            # Kill any existing npm processes that might be stuck
            echo 'Checking for existing npm processes...'
            pkill -f npm || echo 'No existing npm processes found'
            sleep 2
            
            # Install dependencies with timeout and retry logic
            echo 'Installing dependencies with timeout protection...'
            install_dependencies() {
              # Try npm ci first (faster)
              if [ -f package-lock.json ]; then
                echo 'Attempting npm ci...'
                timeout 300 npm ci --omit=dev --no-audit --no-fund --prefer-offline || {
                  echo 'npm ci failed or timed out, trying npm install...'
                  timeout 300 npm install --omit=dev --no-audit --no-fund --prefer-offline
                }
              else
                echo 'No package-lock.json, using npm install...'
                timeout 300 npm install --omit=dev --no-audit --no-fund --prefer-offline
              fi
            }
            
            # Retry logic for dependency installation
            for attempt in 1 2 3; do
              echo \"Installation attempt \$attempt/3...\"
              if install_dependencies; then
                echo 'Dependencies installed successfully!'
                break
              else
                echo \"Installation attempt \$attempt failed\"
                if [ \$attempt -lt 3 ]; then
                  echo 'Waiting 10 seconds before retry...'
                  sleep 10
                  # Clean up any partial installation
                  rm -rf node_modules
                  npm cache clean --force
                else
                  echo 'All installation attempts failed'
                  exit 1
                fi
              fi
            done
            
            # Verify installation
            echo 'Verifying installation...'
            if [ -d node_modules ] && [ -f node_modules/.package-lock.json ] || [ -f node_modules/.package.json ]; then
              echo 'Dependencies verified successfully'
            else
              echo 'Dependency verification failed'
              exit 1
            fi
            
            echo 'Restarting application with PM2...'
            pm2 restart uploader || pm2 start npm --name 'uploader' -- start
            echo 'Application deployment completed successfully'
          "

      - name: Verify SSM Agent after deployment
        run: |
          echo "Verifying SSM Agent status after deployment..."
          ssh ec2-deploy "
            echo '=== Post-Deployment SSM Agent Check ==='
            systemctl status amazon-ssm-agent --no-pager -l
            echo 'SSM Agent verification complete'
          "

      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Deployment to EC2 successful"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
