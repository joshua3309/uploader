name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup-node js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install dependencies
        run: npm ci 

      - name: run lint
        run: npm run lint

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: build app
        run: npm run build

      - name: Debug files before deployment
        run: |
          echo "Checking if .next directory exists:"
          ls -la .next/ || echo ".next directory not found"
          echo "Checking if package.json exists:"
          ls -la package.json || echo "package.json not found"
          echo "Checking if public directory exists:"
          ls -la public/ || echo "public directory not found"
          echo "Checking if next.config.mjs exists:"
          ls -la next.config.mjs || echo "next.config.mjs not found"

      - name: set-up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH key and configuration
        run: |
          # Create SSH key file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2-ssh-key.pem
          chmod 600 /tmp/ec2-ssh-key.pem
          
          # Create SSH config for better connection management
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ secrets.AWS_EC2_HOST }}
            User ${{ secrets.AWS_EC2_USER }}
            IdentityFile /tmp/ec2-ssh-key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 6
            TCPKeepAlive yes
            ControlMaster auto
            ControlPath /tmp/ssh-%r@%h:%p
            ControlPersist 10m
          EOF
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 ec2-deploy "echo 'SSH connection successful'"

      - name: Deploy to EC2
        run: |
          # Sync files
          rsync -az --delete \
            -e "ssh -o ConnectTimeout=30" \
            --exclude='node_modules' --exclude='.git' --exclude='.next/cache' \
            ./ ec2-deploy:/home/${{ secrets.AWS_EC2_USER }}/uploader/

          # Deploy and restart
          ssh ec2-deploy "
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            rm -rf node_modules package-lock.json
            npm cache clean --force
            timeout 300 npm install --omit=dev --no-audit --no-fund
            pm2 restart uploader || pm2 start npm --name 'uploader' -- start
          "


      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Deployment to EC2 successful"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
