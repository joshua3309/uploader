name: ci pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup-node js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install dependencies
        run: npm ci 

      - name: run lint
        run: npm run lint

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: build app
        run: npm run build

      - name: Debug files before artifact creation
        run: |
          echo "Checking if .next directory exists:"
          ls -la .next/ || echo ".next directory not found"
          echo "Checking if package.json exists:"
          ls -la package.json || echo "package.json not found"
          echo "Checking if public directory exists:"
          ls -la public/ || echo "public directory not found"
          echo "Checking if next.config.mjs exists:"
          ls -la next.config.mjs || echo "next.config.mjs not found"

      - name: build artifact
        uses: actions/upload-artifact@v4
        with: 
          name: nextjs-build
          path: |
            .next/
            package.json
            package-lock.json
            public/
            next.config.mjs
          retention-days: 7

      - name: Verify artifact creation
        run: |
          echo "Artifact 'nextjs-build' should have been created"
          echo "This step confirms the upload-artifact action completed successfully"
