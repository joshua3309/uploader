name: cd deployment

on:
  workflow_run:
    workflows: ["ci pipeline"]
    types:
      - completed

permissions:
  actions: read  # Required for artifact download
  contents: read # Required for downloading artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        # Note: Keeping for future AWS CLI operations
      - name: Debug workflow run info
        run: |
          echo "Workflow run ID: ${{ github.event.workflow_run.id }}"
          echo "Repository: ${{ github.event.workflow_run.repository.full_name }}"
          echo "Workflow name: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: set-up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
        # Note: Keeping for future Node.js operations
      - name: install aws cli
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
        # Note: Keeping for future AWS CLI operations
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        # Note: Keeping for future AWS services integration
      - name: deploy to ec2
        run: |
          # Create remote directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_KEY }} \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} \
            "mkdir -p /home/${{ secrets.AWS_EC2_USER }}/uploader"
          
          # Sync files to EC2
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_KEY }}" \
            ./ \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/uploader/

          # Install dependencies and restart application
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_KEY }} \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << "EOF"
            
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            npm ci --production
            pm2 restart uploader || pm2 start npm --name "uploader" -- start
          EOF
      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Deployment to EC2 successful"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
