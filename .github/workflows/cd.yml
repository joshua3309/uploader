name: cd deploy

on:
  workflow_run:
    workflows: ["ci pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: nextjs-build
          path: ./

      - name: Verify downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          echo "Checking if .next directory exists:"
          ls -la .next/ || echo ".next directory not found"
          echo "Checking .next contents:"
          ls -la .next/ 2>/dev/null || echo "Cannot list .next contents"
          echo "Checking if package.json exists:"
          ls -la package.json || echo "package.json not found"
          echo "Checking if public directory exists:"
          ls -la public/ || echo "public directory not found"
          echo "Checking if next.config.mjs exists:"
          ls -la next.config.mjs || echo "next.config.mjs not found"
          echo "Artifact verification complete"

      - name: set-up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        
      - name: Setup SSH key and configuration
        run: |
          # Create SSH key file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2-ssh-key.pem
          chmod 600 /tmp/ec2-ssh-key.pem
          
          # Create SSH config for better connection management
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ secrets.AWS_EC2_HOST }}
            User ${{ secrets.AWS_EC2_USER }}
            IdentityFile /tmp/ec2-ssh-key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 6
            TCPKeepAlive yes
            ControlMaster auto
            ControlPath /tmp/ssh-%r@%h:%p
            ControlPersist 10m
          EOF
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 ec2-deploy "echo 'SSH connection successful'"
      - name: Deploy to EC2
        run: |
          # Sync built application files
          rsync -az --delete \
            -e "ssh -o ConnectTimeout=30" \
            --exclude='node_modules' --exclude='.git' --exclude='.next/cache' \
            ./ ec2-deploy:/home/${{ secrets.AWS_EC2_USER }}/uploader/

          # Deploy and restart with downloaded artifacts
          timeout 300 ssh ec2-deploy "
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            echo 'Deploying downloaded Next.js artifacts...'
            echo 'Checking files after sync:'
            ls -la .next/ || echo '.next directory not found'
            ls -la package.json || echo 'package.json not found'
            ls -la public/ || echo 'public directory not found'
            
            # Check if .next directory is complete
            if [ ! -f .next/BUILD_ID ] || [ ! -d .next/server ] || [ ! -d .next/static ]; then
              echo 'ERROR: .next directory is incomplete or corrupted!'
              echo 'Contents of .next directory:'
              ls -la .next/
              echo 'Rebuilding application locally...'
              rm -rf node_modules package-lock.json
              npm cache clean --force
              timeout 300 npm install --omit=dev --no-audit --no-fund
              timeout 300 npm run build
              echo 'Build completed. Checking .next contents:'
              ls -la .next/
            else
              echo '.next directory appears complete'
              rm -rf node_modules package-lock.json
              npm cache clean --force
              timeout 300 npm install --omit=dev --no-audit --no-fund
            fi
            
            echo 'Checking environment variables:'
            echo 'AWS_REGION:' \$AWS_REGION
            echo 'AWS_S3_BUCKET:' \$AWS_S3_BUCKET
            echo 'DEST_BUCKET:' \$DEST_BUCKET
            echo 'NODE_ENV:' \$NODE_ENV
            
            echo 'Built application ready - starting with PM2...'
            
            # Kill any existing PM2 processes
            pm2 delete uploader 2>/dev/null || echo 'No existing PM2 process found'
            
            # Set NODE_ENV to production
            export NODE_ENV=production
            
            # Start the application with PM2
            pm2 start npm --name 'uploader' -- start
            
            # Wait a moment for PM2 to start
            sleep 5
            
            echo 'Checking PM2 status:'
            pm2 status
            
            # Save PM2 configuration
            pm2 save
            
            echo 'Checking if app is running on port 3000:'
            netstat -tlnp | grep :3000 || echo 'Port 3000 not listening'
            
            echo 'Testing application health:'
            curl -I http://localhost:3000 || echo 'Application not responding on localhost:3000'
            
            echo 'Deployment completed successfully!'
          "
      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Deployment to EC2 successful"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
