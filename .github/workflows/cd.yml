name: cd deploy

on:
  workflow_run:
    workflows: ["ci pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci pipeline
          workflow_conclusion: success
          name: nextjs-build
          path: ./

      - name: set-up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        
      - name: Setup SSH key and configuration
        run: |
          # Create SSH key file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2-ssh-key.pem
          chmod 600 /tmp/ec2-ssh-key.pem
          
          # Create SSH config for better connection management
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ secrets.AWS_EC2_HOST }}
            User ${{ secrets.AWS_EC2_USER }}
            IdentityFile /tmp/ec2-ssh-key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 6
            TCPKeepAlive yes
            ControlMaster auto
            ControlPath /tmp/ssh-%r@%h:%p
            ControlPersist 10m
          EOF
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 ec2-deploy "echo 'SSH connection successful'"
      - name: Deploy to EC2
        run: |
          # Sync built application files
          rsync -az --delete \
            -e "ssh -o ConnectTimeout=30" \
            --exclude='node_modules' --exclude='.git' --exclude='.next/cache' \
            ./ ec2-deploy:/home/${{ secrets.AWS_EC2_USER }}/uploader/

          # Deploy and restart with built application
          ssh ec2-deploy "
            cd /home/${{ secrets.AWS_EC2_USER }}/uploader
            echo 'Deploying pre-built Next.js application...'
            rm -rf node_modules package-lock.json
            npm cache clean --force
            timeout 300 npm install --omit=dev --no-audit --no-fund
            echo 'Built application ready - starting with PM2...'
            pm2 restart uploader || pm2 start npm --name 'uploader' -- start
          "
      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"text":"Deployment to EC2 successful"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
